- hosts: wp_hosts
  vars_files:
    - vars.yaml
  vars:
    username: "{{ remote_web_user.name }}"
    authorized_key: "{{ remote_web_user.authorized_key }}"

    wordpress_path: "/var/www/{{ domain.url }}"
    execution_group: nginx
  become: true
  gather_facts: true
  remote_user: "{{ remote_sudo_user.name }}"
  roles:
    - { role: update-system, tags: [system] }
    - { role: install-common-packages, tags: [packages] }
    - { role: configure-firewall, tags: [firewall] }
    - { role: create-user, tags: [user] }
    - { role: geerlingguy.swap, tags: [swap] }
    - { role: geerlingguy.certbot, tags: [certbot] }
    - { role: geerlingguy.nginx, tags: [nginx] }
    - { role: geerlingguy.repo-remi, tags: [php, mysql] }
    - { role: geerlingguy.php-versions, tags: [php] }
    - { role: geerlingguy.php, tags: [php] }
    - { role: geerlingguy.mysql, tags: [mysql] }
    - { role: geerlingguy.redis, tags: [redis] }
    - { role: install-wp-cli, tags: [wp-cli] }
    - { role: install-wordpress, tags: [wordpress] }
