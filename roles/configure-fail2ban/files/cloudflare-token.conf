# Bans are pushed to Cloudflare as zone-level IP access rules (API v4),
# using a scoped API token (Zone -> Firewall Services -> Edit).
# Adapted from fail2ban upstream's cloudflare.conf (which only supports
# the legacy Global API Key). Depends on curl (and optionally jq).

[Definition]

actionstart =
actionstop  =
actioncheck =

# Tags: <ip> IP address, <failures>, <time> unix timestamp of the ban
actionban = curl -s -o /dev/null -X POST <_cf_api_prms> \
            -d '{"mode":"block","configuration":{"target":"<cftarget>","value":"<ip>"},"notes":"Fail2Ban <name>"}' \
            <_cf_api_url>

actionunban = id=$(curl -s -X GET <_cf_api_prms> \
                   "<_cf_api_url>?mode=block&configuration_target=<cftarget>&configuration_value=<ip>&page=1&per_page=1&notes=Fail2Ban%%20<name>" \
                   | { jq -r '.result[0].id' 2>/dev/null || tr -d '\n' | sed -nE 's/^.*"result"\s*:\s*\[\s*\{\s*"id"\s*:\s*"([^"]+)".*$/\1/p'; })
              if [ -z "$id" ]; then echo "<name>: id for <ip> cannot be found"; exit 0; fi;
              curl -s -o /dev/null -X DELETE <_cf_api_prms> "<_cf_api_url>/$id"

_cf_api_url = https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules
_cf_api_prms = -H 'Authorization: Bearer <cftoken>' -H 'Content-Type: application/json'

[Init]

cftoken =

cfzone =

cftarget = ip

[Init?family=inet6]
cftarget = ip6
